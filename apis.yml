name: Graviti
description: >-
  Graviti is a Mexico City-based consumer fintech founded in 2020 that unlocks
  affordable access to essential home utilities for unbanked and underserved
  Mexican families, starting with solar water heaters financed through a
  pay-as-you-go (PayGo / BNPL) model of small recurring payments. Backed by 500
  Global, Clocktower Technology Ventures, Mucker Capital, Active Capital, and
  BFA Global's Catalyst Fund, the company combines hardware installation with
  embedded consumer lending. Graviti is a consumer-facing product company and
  does not publish a public developer program, API, SDK, or documentation
  surface; this profile was added to the API Evangelist network as a
  VC-portfolio lead and enriched with an honest no-API-surface result.
